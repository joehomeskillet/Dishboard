{% extends "base.html" %}
{% block title %}Player-Aufruf abgewiesen{% endblock %}
{% block body_class %}signage{% endblock %}
{% block skip_link %}{% endblock %}
{% block body %}
<main class="signage-shell" aria-label="Player-Aufruf abgewiesen">
  <header class="signage-header"><div class="wordmark"><span class="wordmark-mark" aria-hidden="true"></span><span>Klinik Südhang</span></div></header>
  <section class="closed-signage"><div class="closed-card"><span class="closed-icon" aria-hidden="true">×</span><h1>Aufruf<br>abgewiesen</h1><p>{{ message }}</p></div></section>
  <footer class="signage-footer"><span>Feste Player-URL erforderlich</span></footer>
</main>
{% endblock %}
