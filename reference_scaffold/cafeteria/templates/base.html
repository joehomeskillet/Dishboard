<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="rgb(6 52 59)">
  <meta name="color-scheme" content="light">
  <title>{% block title %}Südhang Menüplanung{% endblock %}</title>
    <link rel="preload" as="font" type="font/woff2" href="{{ url_for('static', filename='fonts/fira-sans-400.woff2') }}" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="{{ url_for('static', filename='fonts/fira-sans-600.woff2') }}" crossorigin>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  {% block head %}{% endblock %}
</head>
{% set user = session.get('user') %}
<body class="{% block body_class %}{% endblock %}">
  {% block skip_link %}<a class="skip-link" href="#main-content">Zum Inhalt springen</a>{% endblock %}
  {% block body %}{% endblock %}
  {% block scripts %}{% if self.body_class() == 'admin-body' %}<script src="{{ url_for('static', filename='admin.js') }}" defer></script>{% endif %}{% endblock %}
</body>
</html>
