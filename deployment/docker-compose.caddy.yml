services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      CAFETERIA_DOMAIN: ${CAFETERIA_DOMAIN:-dishboard.joelduss.xyz}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile.example:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      cafeteria_internal:
        ipv4_address: 172.31.213.10
    security_opt: ["no-new-privileges:true"]

volumes:
  caddy_data:
  caddy_config:
